<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎹 Piano Player</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="interactive">Interactive Mode</button>
            <button class="mode-btn" data-mode="prepared">Prepared Mode</button>
        </div>

        <div class="status" id="status"></div>

        <div class="controls" id="interactiveControls">
            <button class="btn" id="recordBtn">Start Recording</button>
            <button class="btn" id="downloadBtn" disabled>Download Recording</button>
        </div>

        <div class="prepared-controls" id="preparedControls">
            <div class="file-upload">
                <button class="btn" onclick="document.getElementById('fileInput').click()">Load Song</button>
                <input type="file" id="fileInput" accept=".json">
            </div>
            <div class="song-info" id="songInfo">No song loaded</div>
            <div class="playback-controls">
                <button class="btn" id="playBtn" disabled>Play</button>
                <button class="btn" id="pauseBtn" disabled>Pause</button>
                <button class="btn" id="stopBtn" disabled>Stop</button>
            </div>
            <div class="speed-control">
                <label>Speed: <span id="speedValue">1.0x</span></label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-time" id="progressTime">0:00 / 0:00</div>
            </div>
        </div>

        <div class="piano" id="piano"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
